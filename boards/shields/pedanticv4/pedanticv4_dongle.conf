#CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# Studio uses its own CDC ACM UART; do not build a UART console without a
# selected Zephyr console device.
CONFIG_CONSOLE=n

# zmk mouse emulation for trackball/trackpad
CONFIG_ZMK_POINTING=y

# encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_LV_Z_VDB_SIZE=25